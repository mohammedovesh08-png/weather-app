<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca3;
        }

        .weather {
            margin-top: 25px;
            padding: 20px;
            background: #f5f9ff;
            border-radius: 15px;
        }

        .temperature {
            font-size: 45px;
            font-weight: bold;
            color: #1976d2;
        }

        .condition {
            text-transform: capitalize;
            font-size: 20px;
            margin: 10px 0 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            background: white;
            padding: 12px;
            border-radius: 10px;
        }

        .error {
            margin-top: 20px;
            color: #d32f2f;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌦️ Weather App</h1>
    <p class="subtitle">Check current weather of any city</p>

    <form method="POST">
        <input
            type="text"
            name="city"
            placeholder="Enter city name"
            required
        >
        <button type="submit">Search</button>
    </form>

    {% if weather %}
    <div class="weather">

        <h2>{{ weather.city }}, {{ weather.country }}</h2>

        <div class="temperature">
            {{ weather.temperature }}°C
        </div>

        <div class="condition">
            {{ weather.condition }}
        </div>

        <div class="details">

            <div class="detail">
                💧 Humidity<br>
                <strong>{{ weather.humidity }}%</strong>
            </div>

            <div class="detail">
                💨 Wind<br>
                <strong>{{ weather.wind }} m/s</strong>
            </div>

        </div>

    </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
